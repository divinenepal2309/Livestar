name: LIVE STAR Creator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          for f in settings.gradle settings.gradle.kts; do
            FOUND=$(find . -type f -name "$f" \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print -quit)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project settings.gradle was not found."
            echo "Check that the repository contains the Android project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK and AAB
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug bundleDebug
          else
            echo "ERROR: gradlew is missing from the Android project."
            echo "The project must include the Gradle Wrapper."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STAR-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STAR-AAB
          path: "**/build/outputs/bundle/debug/*.aab"
          if-no-files-found: error
