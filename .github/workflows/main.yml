name: LIVE STAR Creator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          if [ -f "$ROOT/settings.gradle" ] || \
             [ -f "$ROOT/settings.gradle.kts" ]; then
            PROJECT_DIR="$ROOT"
          else
            ZIP_FILE="$(find "$ROOT" -maxdepth 4 -type f \
              -iname 'LIVE_STAR_CREATOR_PROFILE_STUDIO_UPDATED.zip' \
              ! -path '*/.git/*' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find "$ROOT" -maxdepth 4 -type f \
                -iname '*.zip' ! -path '*/.git/*' | head -n 1)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ZIP was not found."
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"
            mkdir -p "$ROOT/_live_star_project"
            unzip -oq "$ZIP_FILE" -d "$ROOT/_live_star_project"

            SETTINGS_FILE="$(find "$ROOT/_live_star_project" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              ! -path '*/.gradle/*' | head -n 1)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle not found inside ZIP."
              find "$ROOT/_live_star_project" -maxdepth 5 -type f | head -n 100
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK and AAB
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --refresh-dependencies \
              assembleDebug bundleDebug --stacktrace
          else
            echo "Gradle wrapper missing; using Gradle installed by setup-gradle."
            gradle --no-daemon --refresh-dependencies \
              assembleDebug bundleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STAR-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STAR-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
