name: LIVE STAR Creator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="LIVE_STAR_APK_AAB_TESTED_PROJECT.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            echo "Files available in repository:"
            ls -la
            exit 1
          fi

          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          echo "ZIP extracted successfully."
          echo "Extracted files:"
          find extracted_project -maxdepth 3 -type f | head -100

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/gradlew" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted_project -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*"
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No complete Gradle project found in ZIP."
            echo "Searching for Gradle project files:"
            find extracted_project -type f \
              \( -name gradlew \
                 -o -name settings.gradle \
                 -o -name settings.gradle.kts \
                 -o -name build.gradle \
                 -o -name build.gradle.kts \)
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK and AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew --no-daemon \
            assembleDebug \
            bundleDebug \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STAR-APK
          path: "extracted_project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STAR-AAB
          path: "extracted_project/**/build/outputs/bundle/debug/*.aab"
          if-no-files-found: error
