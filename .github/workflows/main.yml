name: LIVE STAR Creator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true

      - name: Install required SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/gradlew" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*"
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project with gradlew not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK and AAB
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STAR-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STAR-AAB
          path: "**/build/outputs/bundle/debug/*.aab"
          if-no-files-found: error
